services:
  # ---------------------------------------------
  # DEV CONTAINER (tsx hot reload)
  # ---------------------------------------------
  server-dev:
    container_name: server_dev_container
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    environment:
      NODE_ENV: dev
      PORT: 5900
    ports:
      - "5900:5900"
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./tsconfig.json
          target: /app/tsconfig.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json

  # ---------------------------------------------
  # PRODUCTION CONTAINER (obfuscated + bundled JS)
  # ---------------------------------------------
  server:
    container_name: server_container
    build:
      context: .
      dockerfile: Dockerfile
      target: production      # runs `dist/server.js` obfuscated
    environment:
      NODE_ENV: prod
      PORT: 5900
    ports:
      - "5900:5900"